name: Idea or missing check
description: A check, an annotation, an output format or an integration kenbi does not have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to check or do
      description: The code pattern or workflow, ideally with a short example of what should be reported and what should not.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What kenbi does today
      description: The finding it reports, or what it misses, on that example.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
